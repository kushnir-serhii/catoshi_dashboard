name: Today range backtest Gate

# Runs src/scripts/today-range-backtest.ts (spec 024, Slice 1 — the Gate) on a
# GitHub Actions runner.
#
# WHY THIS WORKFLOW EXISTS — network reach (decisions.md §10). The script pulls
# 730 days of 1h klines from Binance (fapi.binance.com). Neither execution
# environment available to a coding agent can reach Binance (egress policy), and
# none can reach Neon either. A GitHub Actions runner can reach Binance, so this
# run is operator-only not by preference but because no local agent environment
# can perform it.
#
# NO DATABASE SECRET. The script never opens a database connection — it reads
# public candles and writes results to .cache/today-range/ only. It must not be
# handed a credential it cannot use. Do not add DATABASE_URL,
# DATABASE_URL_UNPOOLED, or any other secret to this file.
#
# The uploaded artifact (.cache/today-range/out/) is the evidence behind the
# functional-spec §0 verdict and the fitted TODAY_SIGMA_K values. It is retained
# far longer than the log on purpose.
#
# workflow_dispatch ONLY. No schedule — every run here is a human decision.

on:
  workflow_dispatch:
    inputs:
      assets:
        description: 'Comma-separated asset list'
        type: string
        default: 'BTC,ETH,SOL'
      days:
        description: 'Days of 1h history to pull'
        type: string
        default: '730'

permissions:
  contents: read

# No `concurrency` group. This workflow writes nothing shared — no database,
# no repository commit — so the `catoshi-db-write` group that guards
# backfill.yml / verify-backfill.yml does not apply here.

jobs:
  today-range-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The runner's bundled npm (10.9.8 on node 22.23.2, confirmed
      # 2026-09-23) rejects the committed, otherwise-valid lockfile with
      # EUSAGE ("Missing: tailwind-merge@3.7.0 from lock file") — a real npm
      # 10-vs-11 resolution difference over an optional-peer tree
      # (@heroui/styles's nested tailwind-variants), not a stale lock:
      # `npm install` against the same lock produces no diff, and `npm ci`
      # passes clean on npm 11.6.4. Upgrade npm itself rather than touch the
      # lockfile.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # actions/cache keys reject commas, and `assets` is a comma-separated
      # list (e.g. "BTC,ETH,SOL") — substitute a safe separator before it
      # reaches the cache key.
      - name: Sanitize cache key inputs
        id: cache_vars
        run: echo "assets_key=$(echo '${{ inputs.assets }}' | tr ',' '-')" >> "$GITHUB_OUTPUT"

      # The script caches downloaded candles under .cache/today-range/ so a
      # re-run does not re-fetch Binance history. Public candles only — nothing
      # sensitive. Keyed on the script + eval sources + the inputs so a code
      # change or a different asset/day set misses cleanly; `today-range-`
      # restores a previous run's candles even on a key miss. NOTE: a cache hit
      # reuses candles ending at the previous run's time; to re-pull the latest
      # data, change an input or edit the sources (or delete the cache in the
      # Actions UI).
      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: .cache/today-range/
          key: today-range-${{ hashFiles('src/scripts/today-range-backtest.ts', 'src/lib/todayRangeEval.ts', 'src/lib/todayRange.ts', 'src/consts/today.ts') }}-${{ steps.cache_vars.outputs.assets_key }}-${{ inputs.days }}
          restore-keys: |
            today-range-

      - name: DIAGNOSTIC — Binance reachability (temporary)
        run: |
          set +e
          echo "--- fapi.binance.com (futures, what the script uses) ---"
          curl -sv --max-time 10 'https://fapi.binance.com/fapi/v1/ping' 2>&1 | tail -30
          echo "--- api.binance.com (spot) ---"
          curl -sv --max-time 10 'https://api.binance.com/api/v3/ping' 2>&1 | tail -30
          echo "--- data-api.binance.vision ---"
          curl -sv --max-time 10 'https://data-api.binance.vision/api/v3/ping' 2>&1 | tail -30
          exit 0

      - name: Run the Gate
        run: |
          set -o pipefail
          echo ">>> TODAY RANGE GATE — assets=${{ inputs.assets }} days=${{ inputs.days }}"
          npm run today-range-backtest -- --assets "${{ inputs.assets }}" --days "${{ inputs.days }}" 2>&1 | tee today-range-backtest.log

      - name: Append report to job summary
        if: always()
        run: |
          {
            echo "## Today range Gate report"
            echo ''
            if [ -f .cache/today-range/out/today-range-report.md ]; then
              cat .cache/today-range/out/today-range-report.md
            else
              echo "(no report — the run step failed before writing one; see the log)"
              echo ''
              echo '```'
              if [ -f today-range-backtest.log ]; then tail -n 40 today-range-backtest.log; fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and results JSON (long retention — outlives the log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-range-results-${{ github.run_id }}
          path: .cache/today-range/out/
          retention-days: 400

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-range-backtest-log-${{ github.run_id }}
          path: today-range-backtest.log
          retention-days: 90
